name: Build iOS IPA

# 手动触发：仓库 Actions 页 → Build iOS IPA → Run workflow
# 产物：本次运行页底部 Artifacts → iBoxReplica-unsigned-ipa
# 未签名，装之前用 Sideloadly / AltStore / TrollStore 自签。

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'build-ipa.sh'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "--- 可用 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # 纯 Swift + WKWebView 壳，任何 15.x/16.x 都能编；优先 15.4 与本地验证版本对齐
          PICK=""
          for v in 15.4 15.3 16.0 16.1; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then PICK="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -n "$PICK" ]; then
            echo "选中 $PICK"
            sudo xcode-select -s "$PICK/Contents/Developer"
          fi
          xcodebuild -version

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build unsigned IPA
        run: ./build-ipa.sh

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iBoxReplica-unsigned-ipa
          path: ios/build/iBoxReplica.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
